<head>

    <title>Browser</title>
    <style>
        @import url("https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.8/dist/web/static/pretendard.css");

        * {
            font-family: "pretendard"
        }

        body {
            background-color: #f3f3f3;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            margin: 0;
        }

        a {
            background-color: #fff;
            border-radius: 16px;
            height: 95px;
            width: 95px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.4);
            position: relative;
            transition: all 0.1s ease-in;
            margin-bottom: 20px;
        }

        a:hover {
            height: 100px;
            width: 100px;
        }

        a img {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 55px;
            height: 55px;
        }

        a label {
            white-space: nowrap;
            text-decoration: none;
            color: white;
            position: absolute;
            top: 98px;
            left: 50%;
            transform: translate(-50%, 20%);
            font-weight: 500;
            font-size: 17px;
            font-weight: bold;
        }

        #tool_wrapper {
            width: 100%;
            display: flex;
            flex-direction: column;
            gap: 20px;
            position: absolute;
            top: 0;
            left: 0;
            justify-content: center;
        }

        #work_tools,
        #support_tools,
        #google_tools,
        #edutech_tools,
        #communication_tools,
        #etcetera_tools,
        #ai_tools,
        #training_tools {
            padding: 20px;
            width: 90%;
            border-radius: 20px;
            background-color: rgba(0, 0, 0, 0.2);
            display: grid;
            grid-template-columns: repeat(auto-fill, 95px);
            grid-auto-rows: auto;
            grid-column-gap: 20px;
            grid-row-gap: 40px;
            justify-content: left;
            margin-left: 3.5%;
        }

        #schedule {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 600px;
            height: 680px;
            pointer-events: none;
            z-index: 998;
        }

        #schedule iframe {
            width: 100%;
            height: 100%;
            border: none;
            border-radius: 20px;
            transform: scale(0.9);
            display: none;
            pointer-events: none;
            z-index: 998;
        }

        #schedule_button {
            cursor: pointer;
            padding: 10px;
            background-color: #fff;
            border-radius: 10px;
            height: 15px;
            width: 15px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.4);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 998;
            position: absolute;
            left: -140px
        }

        #calendar1 {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 800px;
            height: 600px;
            pointer-events: none;
            z-index: 998;
        }

        #calendar1 iframe {
            width: 800px;
            height: 600px;
            border: none;
            border-radius: 20px;
            transform: scale(0.95);
            display: none;
            pointer-events: none;
            z-index: 998;
        }

        #calendar1_button {
            cursor: pointer;
            padding: 10px;
            background-color: #fff;
            border-radius: 10px;
            height: 15px;
            width: 15px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.4);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 998;
            position: absolute;
            left: -70px;
        }

        #calendar2 {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 800px;
            height: 600px;
            pointer-events: none;
            z-index: 998;
        }

        #calendar2 iframe {
            width: 800px;
            height: 600px;
            border: none;
            border-radius: 20px;
            transform: scale(0.95);
            display: none;
            pointer-events: none;
            z-index: 998;
        }

        #calendar2_button {

            background-color: #fff;

            align-items: center;
            justify-content: center;
            z-index: 998;
            position: absolute;
            left: 0px;
        }

        #meals {
            position: fixed;
            top: 50%;
            left: 50%;

            width: 800px;
            height: 600px;
            pointer-events: none;

        }

        }

            height: 15px;
            width: 15px;

            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 998;
            position: absolute;
            left: -210px;
        }

        #buttons {
            position: relative;
            margin-left: 92.5%;
            top: 10px;
        }

        .material-icons {
            font-size: 36px;
            user-select: none;
        }

        #blur-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            backdrop-filter: blur(5px);
            z-index: 990;
            display: none;
            animation: fade-in 0.2s ease-in;
        }

        #container {
            display: flex;
            align-items: center;
            margin-left: 30%;
        }

        #searchIcon {
            width: 36px;
            height: 36px;
            border: 1px solid #ccc;
            border-radius: 50%;
            background-color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: default;
            margin-right: 10px;
        }

        #searchIcon svg {
            width: 20px;
            height: 20px;
            fill: #555;
        }

        #suggestionContainer {
            position: relative;
            width: 400px;
        }

        #suggestionList {
            position: absolute;
            top: 55px;

            left: 0;
            width: 100%;
            max-height: 350px;
            overflow-y: auto;

            background: #fff;

            border-radius: 20px;
            box-shadow: 0 12px 30px rgba(0, 0, 0, 0.15);

            padding: 8px 0;
            margin: 0;

            display: none;
            z-index: 9999;
        }

        #suggestionList li {
            list-style: none;
            padding: 10px 20px;
            cursor: pointer;
            display: flex;
            align-items: center;
            transition: background 0.15s ease;
        }

        #suggestionList li:hover,
        #suggestionList li.active {
            background: #f5f7fa;
        }

        #suggestionList a {
            display: flex;
            align-items: center;
            gap: 12px;
            text-decoration: none;
            color: #333;
            width: 100%;
        }

        #suggestionList .card-icon {
            width: 28px;
            height: 28px;
        }

        #suggestionList .card-title {
            color: #000;
            font-size: 14px;
            font-weight: 500;
        }

        #container input[type="text"] {
            width: 100%;
            height: 50px;
            padding: 0 20px;
            border: 1px solid rgba(0, 0, 0, 0.15);
            border-radius: 25px;
            font-size: 14px;
            box-sizing: border-box;
            background-color: #fff;
            outline: none;
            transition: all 0.2s ease;
        }

        #container input[type="text"]:focus {
            border-color: #4c8bf5;
            box-shadow: 0 4px 12px rgba(76, 139, 245, 0.2);
        }

        #producer li {
            color: #999999;
            flex-wrap: wrap;
            gap: 5px;
        }

        iframe {
            animation: fade-in ease-in 0.3s;
        }

        #cards {
            display: flex;
            flex-direction: column;
            align-items: center;
            display: none;
        }

        .card {
            width: 90%;
            background: #fff;
            padding: 20px;
            border-radius: 20px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
            margin-bottom: 10px;
            word-wrap: break-word;
            overflow-wrap: break-word;
            display: none;
        }

        .card p {
            white-space: pre-wrap;
            line-height: 1.6;
            font-size: 18px;
            color: #444;
        }

        @keyframes fade-in {
            0% {
                opacity: 0;
            }

            100% {
                opacity: 1;
            }
        }
    </style>
</head>

    <div id="blur-overlay"></div>

    <link href="https://fonts.googleapis.com/icon?family=Material&#43;Icons" rel="stylesheet">

    <script>
        let currentFocus = -1;

        function getInitialConsonants(word) {

            const initial = [
                'ㄱ', 'ㄲ', 'ㄴ', 'ㄷ', 'ㄸ', 'ㄹ',
                'ㅁ', 'ㅂ', 'ㅃ', 'ㅅ', 'ㅆ',
                'ㅇ', 'ㅈ', 'ㅉ', 'ㅊ', 'ㅋ',
                'ㅌ', 'ㅍ', 'ㅎ'
            ];

            let result = '';

            for (let i = 0; i < word.length; i++) {

                const ch = word.charCodeAt(i) - 44032;

                if (ch >= 0 && ch <= 11171) {
                    result += initial[Math.floor(ch / 588)];
                } else {
                    result += word[i];
                }
            }

            return result;
        }

        function showSuggestions() {

            const inputEl = document.getElementById("inputField");
            const list = document.getElementById("suggestionList");

            if (!inputEl || !list) return;

            const input = inputEl.value.trim();
            list.innerHTML = "";
            currentFocus = -1;

            if (input === "") {
                list.style.display = "none";
                return;
            }

            const val = input.toLowerCase();
            const isInitialSearch = /^[ㄱ-ㅎ]+$/.test(input);


            const titleElements = document.querySelectorAll(".card-title");

            let matchCount = 0;

            for (let i = 0; i < titleElements.length; i++) {

                const titleEl = titleElements[i];
                const parentLink = titleEl.closest("a");

                if (!parentLink) continue;

                const text = titleEl.textContent.trim().toLowerCase();
                const textInitial = getInitialConsonants(text);

                let isMatch = false;

                if (isInitialSearch) {
                    isMatch = textInitial.indexOf(val) !== -1;
                } else {
                    isMatch = text.indexOf(val) !== -1;
                }

                if (isMatch) {

                    const li = document.createElement("li");
                    li.className = "suggestion-item";

                    const cloned = parentLink.cloneNode(true);

                    li.appendChild(cloned);

                    li.addEventListener("click", function () {
                        window.open(parentLink.href, "_blank");
                        list.style.display = "none";
                    });

                    list.appendChild(li);
                    matchCount++;
                }
            }

            if (matchCount === 0) {
                const li = document.createElement("li");
                li.textContent = "검색 결과가 없습니다.";
                list.appendChild(li);
            }

            list.style.display = "block";
        }

        function checkEnterKey(e) {

            const list = document.getElementById("suggestionList");
            if (!list) return;

            const items = list.getElementsByTagName("li");

            if (e.key === "ArrowDown") {
                currentFocus++;
                addActive(items);
                e.preventDefault();
            }

            else if (e.key === "ArrowUp") {
                currentFocus--;
                addActive(items);
                e.preventDefault();
            }

            else if (e.key === "Enter") {

                e.preventDefault();

                if (currentFocus > -1 && items[currentFocus]) {
                    items[currentFocus].click();
                }
            }
        }

        function addActive(items) {

            if (!items || items.length === 0) return;

            removeActive(items);

            if (currentFocus >= items.length) currentFocus = 0;
            if (currentFocus < 0) currentFocus = items.length - 1;

            items[currentFocus].classList.add("active");
        }

        function removeActive(items) {

            for (let i = 0; i < items.length; i++) {
                items[i].classList.remove("active");
            }
        }

        document.addEventListener("click", function (e) {

            const container = document.getElementById("suggestionContainer");
            const list = document.getElementById("suggestionList");

            if (!container || !list) return;

            if (!container.contains(e.target)) {
                list.style.display = "none";
            }
        });

        function toggleCalendar1() {
            const iframe = document.querySelector("#calendar1 iframe");
            const icon = document.getElementById("calendar1_icon");
            const blurOverlay = document.getElementById("blur-overlay");

            const isVisible = iframe.style.display === "block";

            iframe.style.display = isVisible ? "none" : "block";
            iframe.style.pointerEvents = isVisible ? "none" : "auto";

            icon.textContent = isVisible ? "calendar_today" : "close";

            if (blurOverlay) {
                blurOverlay.style.display = isVisible ? "none" : "block";
            }
        }

        function toggleCalendar2() {
            const iframe = document.querySelector("#calendar2 iframe");
            const icon = document.getElementById("calendar2_icon");
            const blurOverlay = document.getElementById("blur-overlay");

            const isVisible = iframe.style.display === "block";

            iframe.style.display = isVisible ? "none" : "block";
            iframe.style.pointerEvents = isVisible ? "none" : "auto";

            icon.textContent = isVisible ? "calendar_today" : "close";

            if (blurOverlay) {
                blurOverlay.style.display = isVisible ? "none" : "block";
            }
        }

        function toggleschedule() {
            const iframe = document.querySelector("#schedule iframe");

            const icon = document.getElementById("schedule_icon");

            const blurOverlay = document.getElementById("blur-overlay");

            const isVisible = iframe.style.display === "block";

            iframe.style.display = isVisible ? "none" : "block";

            iframe.style.pointerEvents = isVisible ? "none" : "auto";

            icon.textContent = isVisible ? "schedule" : "close";

            if (blurOverlay) {
                blurOverlay.style.display = isVisible ? "none" : "block";
            }
        }

        function togglemeals() {
            const iframe = document.querySelector("#meals iframe");

            const icon = document.getElementById("meals_icon");

            const blurOverlay = document.getElementById("blur-overlay");

            const isVisible = iframe.style.display === "block";

            iframe.style.display = isVisible ? "none" : "block";

            iframe.style.pointerEvents = isVisible ? "none" : "auto";

            icon.textContent = isVisible ? "restaurant_menu" : "close";

            if (blurOverlay) {
                blurOverlay.style.display = isVisible ? "none" : "block";
            }
        }

        document.addEventListener("click", function (event) {
            const blurOverlay = document.getElementById("blur-overlay");

            const calendar2Div = document.getElementById("calendar2");
            const calendar2Button = document.getElementById("calendar2_button");
            const calendar2Iframe = calendar2Div.querySelector("iframe");
            const calendar2Icon = document.getElementById("calendar2_icon");

            const calendar2Visible = calendar2Iframe.style.display === "block";

            if (
                calendar2Visible &&
                !calendar2Div.contains(event.target) &&
                !calendar2Button.contains(event.target)
            ) {
                calendar2Iframe.style.display = "none";
                calendar2Iframe.style.pointerEvents = "none";
                calendar2Icon.textContent = "campaign";
            }

            const calendar1Div = document.getElementById("calendar1");
            const calendar1Button = document.getElementById("calendar1_button");
            const calendar1Iframe = calendar1Div.querySelector("iframe");
            const calendar1Icon = document.getElementById("calendar1_icon");

            const calendar1Visible = calendar1Iframe.style.display === "block";

            if (
                calendar1Visible &&
                !calendar1Div.contains(event.target) &&
                !calendar1Button.contains(event.target)
            ) {
                calendar1Iframe.style.display = "none";
                calendar1Iframe.style.pointerEvents = "none";
                calendar1Icon.textContent = "calendar_today";
            }

            const scheduleDiv = document.getElementById("schedule");
            const scheduleButton = document.getElementById("schedule_button");
            const scheduleIframe = scheduleDiv.querySelector("iframe");
            const scheduleIcon = document.getElementById("schedule_icon");

            const scheduleVisible = scheduleIframe.style.display === "block";

            if (
                scheduleVisible &&
                !scheduleDiv.contains(event.target) &&
                !scheduleButton.contains(event.target)
            ) {
                scheduleIframe.style.display = "none";
                scheduleIframe.style.pointerEvents = "none";
                scheduleIcon.textContent = "schedule";
            }

            const mealsDiv = document.getElementById("meals");
            const mealsButton = document.getElementById("meals_button");
            const mealsIframe = mealsDiv.querySelector("iframe");
            const mealsIcon = document.getElementById("meals_icon");

            const mealsVisible = mealsIframe.style.display === "block";

            if (
                mealsVisible &&
                !mealsDiv.contains(event.target) &&
                !mealsButton.contains(event.target)
            ) {
                mealsIframe.style.display = "none";
                mealsIframe.style.pointerEvents = "none";
                mealsIcon.textContent = "restaurant_menu";
            }

            const finalCalendar2Visible = document.querySelector("#calendar2 iframe").style.display === "block";

            const finalCalendar1Visible = document.querySelector("#calendar1 iframe").style.display === "block";

            const finalScheduleVisible = document.querySelector("#schedule iframe").style.display === "block";

            const finalMealsVisible = document.querySelector("#meals iframe").style.display === "block";

            if (blurOverlay) {
                blurOverlay.style.display = (finalCalendar2Visible ||
                    finalCalendar1Visible || finalScheduleVisible || finalMealsVisible) ? "block" : "none";
            }
        });
    </script>
